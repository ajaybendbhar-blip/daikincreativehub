<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daikin Creative Studio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f8fc;
      color: #132238;
    }
    .header {
      padding: 12px 18px;
      background: #fff;
      border-bottom: 1px solid #dbe4ef;
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: #1177c8;
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: bold;
    }
    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 16px;
      padding: 16px;
    }
    .card {
      background: #fff;
      border: 1px solid #dbe4ef;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(18,34,56,.10);
    }
    .panel {
      padding: 16px;
    }
    .field { margin-bottom: 12px; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #5f7188;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    select, input, textarea {
      width: 100%;
      border: 1px solid #d7dfeb;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      background: #fff;
    }
    textarea {
      min-height: 80px;
      resize: vertical;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .offers {
      max-height: 180px;
      overflow: auto;
      border: 1px solid #d7dfeb;
      border-radius: 10px;
      padding: 8px;
      background: #fafcff;
    }
    .offer-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 4px;
      font-size: 13px;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(180deg, #1177c8, #0d5ea6);
    }
    button.secondary {
      background: #1f2d44;
    }
    .status {
      margin-top: 12px;
      font-size: 12px;
      padding: 10px 12px;
      background: #f6f9fc;
      border: 1px solid #dce5ef;
      border-radius: 10px;
      white-space: pre-wrap;
      color: #52647b;
    }
    .poster-wrap {
      padding: 14px;
    }
    .poster {
      position: relative;
      width: min(100%, 860px);
      aspect-ratio: 2 / 3;
      margin: auto;
      overflow: hidden;
      border-radius: 18px;
      background: #102745;
    }
    .poster-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .dealer-strip {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      background: rgba(255,255,255,.96);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      border: 1px solid rgba(255,255,255,.7);
      backdrop-filter: blur(8px);
    }
    .dealer-name {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 5px;
    }
    .dealer-meta {
      font-size: 12px;
      color: #46586f;
      line-height: 1.4;
    }
    .qr-box {
      width: 110px;
      text-align: center;
    }
    .qr-box img {
      width: 96px;
      height: 96px;
      background: #fff;
      padding: 4px;
      border: 1px solid #d7e3ef;
      border-radius: 10px;
      display: block;
      margin: 0 auto 6px;
    }
    .qr-text {
      font-size: 10px;
      color: #5b6d83;
      font-weight: 700;
    }
    @media (max-width: 1080px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">D</div>
    <div>
      <div style="font-weight:700;">Daikin Creative Studio</div>
      <div style="font-size:12px;color:#6b7a90;">Simple AI campaign creator</div>
    </div>
  </div>

  <div class="layout">
    <div class="card panel">
      <div class="field">
        <label>Dealer</label>
        <select id="dspCode"></select>
      </div>

      <div class="field">
        <label>Campaign Theme</label>
        <select id="campaign"></select>
      </div>

      <div class="field">
        <label>Selected Offers</label>
        <div id="offersBox" class="offers"></div>
      </div>

      <div class="field">
        <label>Dealer Name</label>
        <input id="dealerName" type="text" />
      </div>

      <div class="field">
        <label>Address</label>
        <input id="address" type="text" />
      </div>

      <div class="row">
        <div class="field">
          <label>City</label>
          <input id="city" type="text" />
        </div>
        <div class="field">
          <label>State</label>
          <input id="state" type="text" />
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>Phone</label>
          <input id="phone" type="text" />
        </div>
        <div class="field">
          <label>Alternate No</label>
          <input id="alternateNo" type="text" />
        </div>
      </div>

      <div class="field">
        <label>GMB URL</label>
        <input id="gmbUrl" type="text" />
      </div>

      <div class="field">
        <label>Notes</label>
        <textarea id="notes" placeholder="Optional creative notes"></textarea>
      </div>

      <div class="actions">
        <button id="generateBtn">Generate Poster</button>
        <button id="downloadBtn" class="secondary">Download</button>
        <button id="saveBtn" class="secondary">Save to Sheet</button>
      </div>

      <div id="status" class="status">Loading...</div>
    </div>

    <div class="card poster-wrap">
      <div class="poster" id="poster">
        <img id="bgImage" class="poster-bg" alt="Generated creative background" />
        <div class="dealer-strip">
          <div style="flex:1;min-width:0;">
            <div style="font-size:10px;font-weight:800;letter-spacing:.08em;color:#5b6d83;text-transform:uppercase;margin-bottom:4px;">Authorized Dealer</div>
            <div id="dealerNamePreview" class="dealer-name">Dealer Name</div>
            <div id="dealerMetaPreview" class="dealer-meta"></div>
          </div>
          <div class="qr-box">
            <img id="qrCode" alt="QR" />
            <div class="qr-text">Scan for Google listing</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwBU0-XjfAiScYeIdZt81OX5qP1QJt97LQVVwE1pDbvn9MADCcRpjFcvHNzVmPaYcLO/exec';

    const els = {
      dspCode: document.getElementById('dspCode'),
      campaign: document.getElementById('campaign'),
      offersBox: document.getElementById('offersBox'),
      dealerName: document.getElementById('dealerName'),
      address: document.getElementById('address'),
      city: document.getElementById('city'),
      state: document.getElementById('state'),
      phone: document.getElementById('phone'),
      alternateNo: document.getElementById('alternateNo'),
      gmbUrl: document.getElementById('gmbUrl'),
      notes: document.getElementById('notes'),
      status: document.getElementById('status'),
      bgImage: document.getElementById('bgImage'),
      dealerNamePreview: document.getElementById('dealerNamePreview'),
      dealerMetaPreview: document.getElementById('dealerMetaPreview'),
      qrCode: document.getElementById('qrCode')
    };

    let dsps = [];
    let offers = [];

    function setStatus(msg) {
      els.status.textContent = msg;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function makeQrUrl(url) {
      return url ? 'https://chart.googleapis.com/chart?cht=qr&chs=180x180&chld=M|0&chl=' + encodeURIComponent(url) : '';
    }

    function getSelectedOfferKeys() {
      return [...document.querySelectorAll('input[name="offer"]:checked')].map(x => x.value);
    }

    function renderOffers(list) {
      els.offersBox.innerHTML = list.map(o => `
        <label class="offer-item">
          <input type="checkbox" name="offer" value="${escapeHtml(o.key)}" />
          <span>${escapeHtml(o.label)}</span>
        </label>
      `).join('');
    }

    function updatePreview() {
      const name = els.dealerName.value.trim();
      const address = els.address.value.trim();
      const city = els.city.value.trim();
      const state = els.state.value.trim();
      const phone = els.phone.value.trim();
      const alt = els.alternateNo.value.trim();
      const gmb = els.gmbUrl.value.trim();

      els.dealerNamePreview.textContent = name || 'Dealer Name';
      els.dealerMetaPreview.textContent = [
        address,
        [city, state].filter(Boolean).join(', '),
        phone ? 'M: ' + phone : '',
        alt ? 'Alt: ' + alt : ''
      ].filter(Boolean).join(' • ');

      els.qrCode.src = makeQrUrl(gmb);
    }

    function fillDealer(dsp) {
      els.dealerName.value = dsp.dspName || '';
      els.address.value = dsp.address || '';
      els.city.value = dsp.city || '';
      els.state.value = dsp.state || '';
      els.phone.value = dsp.ownerContact || '';
      els.alternateNo.value = dsp.alternateNo || '';
      els.gmbUrl.value = dsp.gmbUrl || '';
      updatePreview();
    }

    function renderCampaigns(list) {
      els.campaign.innerHTML = list.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    }

    async function fetchJson(url, options = {}) {
      const res = await fetch(url, options);
      const text = await res.text();
      let json;
      try {
        json = JSON.parse(text);
      } catch (e) {
        throw new Error('Expected JSON but got:\n' + text.slice(0, 300));
      }
      return json;
    }

    async function loadData() {
      setStatus('Loading...');
      const json = await fetchJson(API_URL, { method: 'GET' });
      if (!json.ok) throw new Error(json.error || 'Failed to load data');

      dsps = json.dsps || [];
      offers = json.offers || [];

      if (dsps.length) {
        els.dspCode.innerHTML = '<option value="">Select dealer</option>' + dsps.map(d =>
          `<option value="${escapeHtml(d.dspCode)}">${escapeHtml(d.dspCode)} - ${escapeHtml(d.dspName)}</option>`
        ).join('');
        fillDealer(dsps[0]);
        els.dspCode.value = dsps[0].dspCode;
      }

      renderCampaigns(json.campaigns || []);
      renderOffers(offers);
      updatePreview();
      setStatus('Loaded successfully.');
    }

    async function generatePoster() {
      setStatus('Generating poster...');
      const payload = {
        dspCode: els.dspCode.value,
        campaign: els.campaign.value,
        selectedOffers: getSelectedOfferKeys(),
        dealer: els.dealerName.value,
        address: els.address.value,
        locality: els.city.value,
        state: els.state.value,
        phone: els.phone.value,
        alternateNo: els.alternateNo.value,
        gmbUrl: els.gmbUrl.value,
        notes: els.notes.value
      };

      const json = await fetchJson(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!json.ok) throw new Error((json.debug && json.debug.join('\n')) || json.error || 'Generation failed');

      const d = json.data || {};
      els.bgImage.src = d.bgImageDataUrl || '';
      updatePreview();
      setStatus('Poster generated successfully.');
    }

    async function downloadPoster() {
      const poster = document.getElementById('poster');
      const canvas = await html2canvas(poster, { scale: 2, useCORS: true, backgroundColor: null });
      const a = document.createElement('a');
      a.download = 'daikin_poster.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    }

    async function saveToSheet() {
      const payload = {
        action: 'save_creative',
        dealerCode: els.dspCode.value,
        dealerName: els.dealerName.value,
        campaign: els.campaign.value,
        selectedOffers: getSelectedOfferKeys(),
        gmbUrl: els.gmbUrl.value,
        headline: 'Celebrate ' + els.campaign.value + ' with Daikin Comfort',
        imageDataUrl: els.bgImage.src || ''
      };

      const json = await fetchJson(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!json.ok) throw new Error(json.error || 'Save failed');
      setStatus('Saved to sheet.');
    }

    document.addEventListener('change', (e) => {
      if (e.target && e.target.name === 'offer') updatePreview();
    });

    els.dspCode.addEventListener('change', () => {
      const found = dsps.find(d => String(d.dspCode) === String(els.dspCode.value));
      if (found) fillDealer(found);
    });

    ['dealerName', 'address', 'city', 'state', 'phone', 'alternateNo', 'gmbUrl'].forEach(id => {
      document.getElementById(id).addEventListener('input', updatePreview);
    });

    document.getElementById('generateBtn').addEventListener('click', () => generatePoster().catch(err => setStatus(err.message)));
    document.getElementById('downloadBtn').addEventListener('click', () => downloadPoster().catch(err => setStatus(err.message)));
    document.getElementById('saveBtn').addEventListener('click', () => saveToSheet().catch(err => setStatus(err.message)));

    loadData().catch(err => setStatus(err.message));
  </script>
</body>
</html>
