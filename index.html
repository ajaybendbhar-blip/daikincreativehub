<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daikin Creative Generator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f8fc;
      color: #132238;
    }
    .header {
      padding: 12px 18px;
      background: #fff;
      border-bottom: 1px solid #dbe4ef;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: #1177c8;
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: bold;
    }
    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 16px;
      padding: 16px;
      align-items: start;
    }
    .card {
      background: #fff;
      border: 1px solid #dbe4ef;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(18,34,56,.10);
    }
    .panel {
      padding: 16px;
    }
    .field { margin-bottom: 12px; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #5f7188;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    select, textarea {
      width: 100%;
      border: 1px solid #d7dfeb;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      background: #fff;
    }
    textarea {
      min-height: 80px;
      resize: vertical;
    }
    .offers {
      max-height: 220px;
      overflow: auto;
      border: 1px solid #d7dfeb;
      border-radius: 10px;
      padding: 8px;
      background: #fafcff;
    }
    .offer-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 4px;
      font-size: 13px;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(180deg, #1177c8, #0d5ea6);
    }
    button.secondary {
      background: #1f2d44;
    }
    .status {
      margin-top: 12px;
      font-size: 12px;
      padding: 10px 12px;
      background: #f6f9fc;
      border: 1px solid #dce5ef;
      border-radius: 10px;
      white-space: pre-wrap;
      color: #52647b;
    }
    .poster-wrap {
      padding: 14px;
    }
    .poster {
      position: relative;
      width: min(100%, 860px);
      aspect-ratio: 2 / 3;
      margin: auto;
      overflow: hidden;
      border-radius: 18px;
      background: #102745;
      box-shadow: 0 12px 40px rgba(18,34,56,.10);
    }
    .poster-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    @media (max-width: 1080px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">D</div>
    <div>
      <div style="font-weight:700;">Daikin Creative Generator</div>
      <div style="font-size:12px;color:#6b7a90;">Simple AI campaign image tool</div>
    </div>
  </div>

  <div class="layout">
    <div class="card panel">
      <div class="field">
        <label>Campaign Theme</label>
        <select id="campaign"></select>
      </div>

      <div class="field">
        <label>Selected Offers</label>
        <div id="offersBox" class="offers"></div>
      </div>

      <div class="field">
        <label>Notes</label>
        <textarea id="notes" placeholder="Optional creative instructions"></textarea>
      </div>

      <div class="actions">
        <button id="generateBtn">Generate Creative</button>
        <button id="downloadBtn" class="secondary">Download</button>
      </div>

      <div id="status" class="status">Loading...</div>
    </div>

    <div class="card poster-wrap">
      <div class="poster" id="poster">
        <img id="bgImage" class="poster-bg" alt="Generated creative background" />
      </div>
    </div>
  </div>

  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxiKXz_Zq045D3k28deCHFm5gR5eVpwC2tzwGfQPNko0wO8bMkjb178aH56Ro-3B8hU/exec';

    const els = {
      campaign: document.getElementById('campaign'),
      offersBox: document.getElementById('offersBox'),
      notes: document.getElementById('notes'),
      status: document.getElementById('status'),
      bgImage: document.getElementById('bgImage')
    };

    let offers = [];

    function setStatus(msg) {
      els.status.textContent = msg;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderCampaigns(list) {
      els.campaign.innerHTML = list.map(c =>
        `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`
      ).join('');
    }

    function renderOffers(list) {
      els.offersBox.innerHTML = list.map(o => `
        <label class="offer-item">
          <input type="checkbox" name="offer" value="${escapeHtml(o.key)}" />
          <span>${escapeHtml(o.label)}</span>
        </label>
      `).join('');
    }

    function getSelectedOfferKeys() {
      return [...document.querySelectorAll('input[name="offer"]:checked')].map(x => x.value);
    }

    async function fetchJson(url, options = {}) {
      const res = await fetch(url, options);
      const text = await res.text();

      let json;
      try {
        json = JSON.parse(text);
      } catch (e) {
        throw new Error('Expected JSON but got:\n' + text.slice(0, 300));
      }

      if (!res.ok) {
        throw new Error(json.error || text || 'Request failed');
      }

      return json;
    }

    async function loadData() {
      setStatus('Loading...');
      const json = await fetchJson(API_URL, { method: 'GET' });
      if (!json.ok) throw new Error(json.error || 'Failed to load data');

      renderCampaigns(json.campaigns || []);
      offers = json.offers || [];
      renderOffers(offers);

      setStatus('Loaded successfully.');
    }

    async function generateCreative() {
      setStatus('Generating creative...');
      const payload = {
        campaign: els.campaign.value,
        selectedOffers: getSelectedOfferKeys(),
        notes: els.notes.value
      };

      const json = await fetchJson(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!json.ok) {
        throw new Error((json.debug && json.debug.join('\n')) || json.error || 'Generation failed');
      }

      const d = json.data || {};
      els.bgImage.src = d.bgImageDataUrl || '';
      setStatus('Creative generated successfully.');
    }

    async function downloadCreative() {
      const poster = document.getElementById('poster');
      const canvas = await html2canvas(poster, { scale: 2, useCORS: true, backgroundColor: null });
      const a = document.createElement('a');
      a.download = 'daikin_creative.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    }

    document.getElementById('generateBtn').addEventListener('click', () =>
      generateCreative().catch(err => setStatus(err.message))
    );

    document.getElementById('downloadBtn').addEventListener('click', () =>
      downloadCreative().catch(err => setStatus(err.message))
    );

    loadData().catch(err => setStatus(err.message));
  </script>
</body>
</html>
