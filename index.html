<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daikin Creative Studio</title>
  <style>
    :root{
      --bg:#f5f8fc;
      --panel:#ffffff;
      --ink:#132238;
      --muted:#6b7a90;
      --blue:#1177c8;
      --blue2:#0d5ea6;
      --line:#dbe4ef;
      --shadow:0 12px 40px rgba(18,34,56,.10);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:var(--bg);
      color:var(--ink);
    }
    .app-header{
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px 18px;
      background:#fff;
      border-bottom:1px solid var(--line);
      position:sticky;
      top:0;
      z-index:10;
    }
    .logo{
      width:28px;height:28px;border-radius:8px;
      background:#1184c7;color:#fff;display:flex;align-items:center;justify-content:center;
      font-weight:700;
    }
    .title-wrap h1{
      margin:0;font-size:20px;line-height:1.1;
    }
    .title-wrap p{
      margin:2px 0 0;font-size:12px;color:var(--muted);
    }
    .layout{
      display:grid;
      grid-template-columns: 360px 1fr;
      gap:16px;
      padding:16px;
      align-items:start;
    }
    .card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:16px;
      box-shadow:var(--shadow);
    }
    .form-card{padding:16px}
    .form-card h2{
      margin:0 0 12px;
      font-size:22px;
    }
    .hint{
      margin:0 0 16px;
      font-size:12px;
      color:var(--muted);
      line-height:1.45;
    }
    .field{margin-bottom:12px}
    label{
      display:block;
      font-size:11px;
      letter-spacing:.04em;
      font-weight:700;
      color:#5f7188;
      margin-bottom:6px;
    }
    input, select, textarea{
      width:100%;
      border:1px solid #d7dfeb;
      background:#fff;
      border-radius:8px;
      padding:10px 12px;
      font-size:13px;
      outline:none;
    }
    textarea{min-height:78px;resize:vertical}
    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:12px;
    }
    button{
      border:0;
      border-radius:999px;
      padding:11px 16px;
      cursor:pointer;
      font-weight:700;
      color:#fff;
      background:linear-gradient(180deg,var(--blue),var(--blue2));
    }
    button.secondary{
      background:#1f2d44;
    }
    button.ghost{
      background:#eef5fb;
      color:#1768a6;
      border:1px solid #cfe3f4;
    }
    .status{
      margin-top:12px;
      font-size:12px;
      padding:10px 12px;
      background:#f6f9fc;
      border:1px solid #dce5ef;
      border-radius:10px;
      color:#52647b;
    }

    .poster-wrap{
      padding:14px;
    }
    .poster{
      position:relative;
      width:min(100%, 860px);
      aspect-ratio: 2 / 3;
      margin:auto;
      overflow:hidden;
      border-radius:18px;
      box-shadow:var(--shadow);
      background:#102745;
    }
    .poster-bg{
      position:absolute;inset:0;
      width:100%;height:100%;
      object-fit:cover;
      display:block;
    }

    .dealer-strip{
      position:absolute;
      left:14px;
      right:14px;
      bottom:14px;
      background:rgba(255,255,255,.96);
      border-radius:16px;
      padding:14px;
      display:flex;
      justify-content:space-between;
      gap:16px;
      align-items:center;
      border:1px solid rgba(255,255,255,.7);
      backdrop-filter: blur(8px);
    }
    .dealer-info{
      min-width:0;
      flex:1;
    }
    .dealer-label{
      font-size:10px;
      font-weight:800;
      letter-spacing:.08em;
      color:#5b6d83;
      text-transform:uppercase;
      margin-bottom:4px;
    }
    .dealer-name{
      font-size:22px;
      font-weight:800;
      line-height:1.1;
      margin-bottom:6px;
      color:#12263d;
    }
    .dealer-meta{
      font-size:12px;
      line-height:1.4;
      color:#46586f;
      word-break:break-word;
    }
    .qr-box{
      width:102px;
      min-width:102px;
      text-align:center;
    }
    .qr-box img{
      width:96px;
      height:96px;
      display:block;
      margin:0 auto 6px;
      border-radius:10px;
      background:#fff;
      padding:4px;
      border:1px solid #d7e3ef;
    }
    .qr-box .qr-text{
      font-size:10px;
      color:#5b6d83;
      font-weight:700;
    }

    @media (max-width: 1080px){
      .layout{grid-template-columns:1fr}
      .poster{width:100%;max-width:860px}
    }
  </style>
</head>
<body>
  <div class="app-header">
    <div class="logo">D</div>
    <div class="title-wrap">
      <h1>Daikin Creative Studio</h1>
      <p>Background image only, dealer strip and QR from HTML.</p>
    </div>
  </div>

  <div class="layout">
    <div class="card form-card">
      <h2>Create campaign poster</h2>
      <p class="hint">
        The generated background stays clean. The poster overlay handles only dealer strip and QR.
      </p>

      <div class="field">
        <label for="dspCode">Dealer</label>
        <select id="dspCode"></select>
      </div>

      <div class="field">
        <label for="dealerName">Dealership name</label>
        <input id="dealerName" type="text" />
      </div>

      <div class="field">
        <label for="address">DSP address</label>
        <input id="address" type="text" />
      </div>

      <div class="row">
        <div class="field">
          <label for="city">City</label>
          <input id="city" type="text" />
        </div>
        <div class="field">
          <label for="state">State</label>
          <input id="state" type="text" />
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="phone">Owner no</label>
          <input id="phone" type="text" />
        </div>
        <div class="field">
          <label for="alternateNo">Alternate no</label>
          <input id="alternateNo" type="text" />
        </div>
      </div>

      <div class="field">
        <label for="campaign">Campaign
                <div class="field">
        <label for="campaign">Campaign</label>
        <select id="campaign"></select>
      </div>

      <div class="field">
        <label for="gmbUrl">GMB URL</label>
        <input id="gmbUrl" type="text" placeholder="Auto-loaded from master sheet" />
      </div>

      <div class="field">
        <label for="notes">Notes</label>
        <textarea id="notes" placeholder="Optional campaign instructions for background generation only"></textarea>
      </div>

      <div class="actions">
        <button id="generateBtn" type="button">Generate Poster</button>
        <button id="downloadBtn" class="secondary" type="button">Download Poster</button>
        <button id="reviewBtn" class="ghost" type="button">Submit for Review</button>
      </div>

      <div id="status" class="status">Loaded successfully.</div>
    </div>

    <div class="card poster-wrap">
      <div class="poster" id="poster">
        <img id="bgImage" class="poster-bg" alt="Generated campaign background" />
        <div class="dealer-strip">
          <div class="dealer-info">
            <div class="dealer-label">Authorized Dealer</div>
            <div id="dealerNamePreview" class="dealer-name"></div>
            <div id="dealerMetaPreview" class="dealer-meta"></div>
          </div>
          <div class="qr-box">
            <img id="qrCode" alt="Dealer GMB QR code" />
            <div class="qr-text">Scan for Google listing</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';

    const els = {
      dspCode: document.getElementById('dspCode'),
      dealerName: document.getElementById('dealerName'),
      address: document.getElementById('address'),
      city: document.getElementById('city'),
      state: document.getElementById('state'),
      phone: document.getElementById('phone'),
      alternateNo: document.getElementById('alternateNo'),
      campaign: document.getElementById('campaign'),
      gmbUrl: document.getElementById('gmbUrl'),
      notes: document.getElementById('notes'),
      status: document.getElementById('status'),
      bgImage: document.getElementById('bgImage'),
      dealerNamePreview: document.getElementById('dealerNamePreview'),
      dealerMetaPreview: document.getElementById('dealerMetaPreview'),
      qrCode: document.getElementById('qrCode'),
      generateBtn: document.getElementById('generateBtn'),
      downloadBtn: document.getElementById('downloadBtn'),
      reviewBtn: document.getElementById('reviewBtn')
    };

    let dsps = [];

    function setStatus(msg) {
      els.status.textContent = msg;
    }

    function makeQrUrl(url) {
      if (!url) return '';
      return 'https://chart.googleapis.com/chart?cht=qr&chs=180x180&chld=M|0&chl=' + encodeURIComponent(url);
    }

    function updatePreview() {
      const name = els.dealerName.value.trim();
      const address = els.address.value.trim();
      const city = els.city.value.trim();
      const state = els.state.value.trim();
      const phone = els.phone.value.trim();
      const alt = els.alternateNo.value.trim();
      const gmb = els.gmbUrl.value.trim();

      els.dealerNamePreview.textContent = name || 'Dealer Name';
      els.dealerMetaPreview.textContent = [
        address,
        [city, state].filter(Boolean).join(', '),
        phone ? 'M: ' + phone : '',
        alt ? 'Alt: ' + alt : ''
      ].filter(Boolean).join(' • ');

      els.qrCode.src = makeQrUrl(gmb) || '';
    }

    function fillDealerFields(dsp) {
      if (!dsp) return;
      els.dealerName.value = dsp.dspName || '';
      els.address.value = dsp.address || '';
      els.city.value = dsp.city || '';
      els.state.value = dsp.state || '';
      els.phone.value = dsp.ownerContact || '';
      els.alternateNo.value = dsp.alternateNo || '';
      els.gmbUrl.value = dsp.gmbUrl || '';
      updatePreview();
    }

    function renderDsps(list) {
      els.dspCode.innerHTML = '<option value="">Select dealer</option>' + list.map(d =>
        `<option value="${escapeHtml(d.dspCode)}">${escapeHtml(d.dspCode)} - ${escapeHtml(d.dspName)}</option>`
      ).join('');
    }

    function renderCampaigns(campaigns) {
      els.campaign.innerHTML = campaigns.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadInitialData() {
      setStatus('Loading...');
      const res = await fetch(API_URL, { method: 'GET' });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'Failed to load data');

      dsps = json.dsps || [];
      renderDsps(dsps);
      renderCampaigns(json.campaigns || []);
      setStatus('Loaded successfully.');

      if (dsps.length) {
        els.dspCode.value = dsps[0].dspCode || '';
        fillDealerFields(dsps[0]);
      }
    }

    async function generatePoster() {
      setStatus('Generating poster...');
      const payload = {
        dspCode: els.dspCode.value,
        dealer: els.dealerName.value,
        address: els.address.value,
        locality: els.city.value,
        state: els.state.value,
        phone: els.phone.value,
        alternateNo: els.alternateNo.value,
        campaign: els.campaign.value,
        gmbUrl: els.gmbUrl.value,
        notes: els.notes.value
      };

      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'Failed to generate poster');

      const data = json.data || {};
      els.bgImage.src = data.bgImageDataUrl || '';
      els.gmbUrl.value = data.gmbUrl || els.gmbUrl.value;
      updatePreview();

      setStatus('Poster generated successfully.');
    }

    async function downloadPoster() {
      const poster = document.getElementById('poster');
      const canvas = await html2canvas(poster, { scale: 2, useCORS: true, backgroundColor: null });
      const link = document.createElement('a');
      link.download = 'daikin_poster.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    async function submitForReview() {
      setStatus('Submitting for review...');
      const payload = {
        action: 'submit_for_review',
        dealerCode: els.dspCode.value,
        dealerName: els.dealerName.value,
        campaign: els.campaign.value,
        headline_en: '',
        body_en: '',
        imageDataUrl: els.bgImage.src || ''
      };

      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'Failed to submit');

      setStatus('Submitted for review.');
    }

    els.dspCode.addEventListener('change', () => {
      const found = dsps.find(d => String(d.dspCode) === String(els.dspCode.value));
      if (found) fillDealerFields(found);
    });

    ['dealerName','address','city','state','phone','alternateNo','gmbUrl'].forEach(id => {
      document.getElementById(id).addEventListener('input', updatePreview);
    });

    els.generateBtn.addEventListener('click', () => generatePoster().catch(err => setStatus(err.message)));
    els.downloadBtn.addEventListener('click', () => downloadPoster().catch(err => setStatus(err.message)));
    els.reviewBtn.addEventListener('click', () => submitForReview().catch(err => setStatus(err.message)));

    loadInitialData().catch(err => setStatus(err.message));
    updatePreview();
  </script>

  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</body>
</html>
